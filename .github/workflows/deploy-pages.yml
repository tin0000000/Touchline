name: Deploy Touchline phone app
on:
  push:
    branches: [main]
    paths:
      - 'Installable App/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: https://tin0000000.github.io/Touchline/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 'Installable App'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
