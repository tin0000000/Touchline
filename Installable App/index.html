function pagePlayerCards(){if(state.mode==='player')return pageCard();return `${title('SQUAD PROFILES','Player cards','Open each player’s stats card or copy a shareable link.','')}<section class="panel team-cards-panel"><div class="panel-head"><h2>${esc(state.club)} squad</h2><span class="eyebrow">${state.players.length} CARDS</span></div><div class="team-card-list">${state.players.map(p=>`<article class="team-card-row">${face(p)}<div class="team-card-copy"><strong>${esc(p.name)}</strong><small>#${p.number} · ${esc(positionText(p))}</small></div><span class="team-card-stats">${p.goals} G · ${p.assists} A · ${Number(p.rating||0).toFixed(1)} RTG</span><button class="btn btn-light btn-sm" onclick="openPlayerCard(${p.id})">View card</button><button class="btn btn-light btn-sm" onclick="editPlayerNumber(${p.id})">Edit jersey number</button><button class="text-link" onclick="sharePlayerCard(${p.id})">Copy link</button></article>`).join('')||'<p class="muted">Add players to create player cards.</p>'}</div></section>`}function openPlayerCard(id){if(!player(id))return;state.sharedCardView=null;state.selectedPlayerId=+id;state.page='card';save();render()}async function sharePlayerCard(id){let p=state.sharedCardView||player(id);if(!p)return;let card={id:p.id,name:p.name,first:p.first,last:p.last,number:p.number,pos:p.pos,positions:p.positions,apps:p.apps,goals:p.goals,assists:p.assists,rating:p.rating,stats:p.stats||{},season:state.season,club:state.club,crest:state.crest,home:state.home,away:state.away};let bytes=new TextEncoder().encode(JSON.stringify(card)),binary=Array.from(bytes,b=>String.fromCharCode(b)).join(''),token=btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');let url=new URL(location.href);url.hash='player-card-v1-'+token;try{await navigator.clipboard.writeText(url.href);toast('Shareable player card link copied')}catch(e){prompt('Copy this shareable player card link',url.href)}}function pageCard(){let p=state.sharedCardView||player(state.selectedPlayerId)||state.players[0];if(!p)return `${title('PLAYER PROFILE','No players in the squad','Add a player to create a player card.','<button class=\"btn btn-dark\" onclick=\"addPlayer()\">Add player</button>')}`;if(state.sharedCardView){let rating=Number(p.rating||0),stats=Object.entries(p.stats||{}).filter(([,v])=>Number(v)>0);return title('PLAYER PROFILE · #'+p.number,p.name+' · Player card',esc(p.club||'Shared player profile'),'<button class="btn btn-light" onclick="sharePlayerCard('+p.id+')">↗ &nbsp; Copy link</button>')+'<div class="player-card"><div class="card-top"><div class="card-club"><div class="team-mini">'+esc(p.crest||'FC')+'</div><span>'+esc((p.club||'Club').toUpperCase())+'<small style="display:block;font:9px DM Mono;color:#91a093;margin-top:3px">'+esc(p.season||'SEASON')+'</small></span></div><div class="ovr">'+Math.round(rating*10)+'<small>RTG</small></div></div><div class="card-person"><div class="card-face">'+p.number+'</div><div><div class="eyebrow" style="color:#b1c0b4">'+esc((p.positions||[p.pos||'Player']).join(' · '))+'</div><h2>'+esc(p.first||p.name)+'</h2><p>#'+p.number+' · '+esc(p.club||'Club player')+'</p></div></div><div class="card-stats"><div class="card-stat"><b>'+(p.apps||0)+'</b><span>APPEARANCES</span></div><div class="card-stat"><b>'+(p.goals||0)+'</b><span>GOALS</span></div><div class="card-stat"><b>'+(p.assists||0)+'</b><span>ASSISTS</span></div><div class="card-stat"><b>'+rating.toFixed(1)+'</b><span>AVG. RATING</span></div></div><div class="stat-ledger-grid">'+stats.map(([k,v])=>'<div><span>'+esc(k.replace(/([A-Z])/g,' $1'))+'</span><b>'+v+'</b></div>').join('')+'</div><div class="card-foot"><span>TOUCHLINE · GRASSROOTS FOOTBALL</span><span>PLAYER NO. '+p.number+'</span></div></div>'}let avgs=p.apps?Math.min(10,p.rating):0;let played=state.history.filter(m=>m.events?.some(e=>e.playerId===p.id||e.assistId===p.id||e.player===p.name));let cards=state.history.flatMap(m=>m.events||[]).filter(e=>e.playerId===p.id&&(e.type==='Yellow card'||e.type==='Red card'));let cardBrowser=state.mode==='manager'?`<div class="card-browser"><select class="filter" aria-label="Choose player card" onchange="openPlayerCard(this.value)">${state.players.map(q=>`<option value="${q.id}" ${+q.id===+p.id?'selected':''}>#${q.number} · ${esc(q.name)}</option>`).join('')}</select><button class="btn btn-light btn-sm" onclick="setPage('cards')">All cards</button><button class="btn btn-light btn-sm" onclick="editPlayerNumber(${p.id})">Edit jersey number</button></div>`:'';return `${title('PLAYER PROFILE · #'+p.number,p.name+' · Player card','Your season, at a glance. Stats update after every match.',cardBrowser+'<button class="btn btn-light" onclick="sharePlayerCard('+p.id+')">↗ &nbsp; Share card</button>')}<div class="player-card"><div class="card-top"><div class="card-club">${crestHTML()}<span>${esc(state.club.toUpperCase())}<small style="display:block;font:9px 'DM Mono';color:#91a093;margin-top:3px">${esc((state.season||'2025 / 26').toUpperCase())} SEASON</small></span></div><div class="ovr">${Math.round(avgs*10)}<small>OVR</small></div></div><div class="card-person"><div class="card-face">${p.number}</div><div><div class="eyebrow" style="color:#b1c0b4">${esc(positionText(p))}</div><h2>${esc(p.first)}<br>${esc(p.last)}</h2><p>✦ &nbsp; ${esc(state.club)} · PLAYER #${p.number}</p></div></div><div class="rating-row"><div>GOALS <strong>${p.goals}</strong></div><div>ASSISTS <strong>${p.assists}</strong></div><div>APPEARANCES <strong>${p.apps}</strong></div><div>FORM <strong>${p.rating.toFixed(1)}</strong></div></div><div class="card-stats"><div class="card-stat"><b>${p.apps}</b><span>APPEARANCES</span></div><div class="card-stat"><b>${p.goals}</b><span>GOALS</span></div><div class="card-stat"><b>${p.assists}</b><span>ASSISTS</span></div><div class="card-stat"><b>${p.rating.toFixed(1)}</b><span>AVG. RATING</span></div><div class="card-stat"><b>${Object.values(playerStatTotals(p)).reduce((sum,v)=>sum+(Number(v)||0),0)}</b><span>MATCH EVENTS</span></div><div class="card-stat"><b>${cards.length}</b><span>CARDS</span></div></div><details class="player-stat-ledger"><summary>Full match statistics</summary><div class="stat-ledger-grid">${Object.entries(playerStatTotals(p)).map(([k,v])=>`<div><span>${esc(k.replace(/([A-Z])/g,' $1'))}</span><b>${v}</b></div>`).join('')}</div></details><div class="card-foot"><span>TOUCHLINE · GRASSROOTS FOOTBALL</span><span>PLAYER NO. ${p.number}</span></div></div><div class="card-actions"><button class="btn btn-light" onclick="exportPlayerCard()">⇧ &nbsp; Preview / export card</button><button class="btn btn-light" onclick="openRating()">✳ &nbsp; Rate my match</button></div><section class="panel" style="max-width:640px;margin:18px auto"><div class="panel-head"><h2>Season match history</h2><button class="text-link" onclick="setPage('history')">Full history&nbsp; →</button></div>${played.slice(0,3).map(m=>`<div class="history-match" onclick="openHistory('${m.id}')"><span class="history-date">${m.date}</span><div><strong>vs ${esc(m.opponent)}</strong><small>${esc(m.competition)}</small></div><span class="history-score">${m.home} — ${m.away}</span><span class="result-pill ${m.result}">${m.result}</span></div>`).join('')||'<p class="muted">Your played matches will appear here.</p>'}</section><section class="panel" style="max-width:640px;margin:18px auto"><div class="panel-head"><h2>My match availability</h2><span class="eyebrow">${(()=>{let f=(state.fixtures||[]).filter(x=>Date.parse(`${x.date}T${x.time||'00:00'}`)>=Date.now()).sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`))[0];return f?`${esc(f.opponent)} · ${esc(f.date)}${f.time?' · '+esc(f.time):''}`:'NO UPCOMING FIXTURE'})()}</span></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><strong style="font-size:12px">Can you make it?</strong><div style="font-size:10px;color:#849087;margin-top:4px">Your manager will be notified</div></div><div class="mode-switch"><button class="${p.avail==='yes'?'active':''}" onclick="myAvailability('yes',${p.id})">✓ In</button><button class="${p.avail==='no'?'active':''}" onclick="myAvailability('no',${p.id})">✕ Out</button><button class="${p.avail==='pending'?'active':''}" onclick="myAvailability('pending',${p.id})">Later</button></div></div></section>`}
function lineupZones(starters,count){let keeper=starters.find(p=>/goalkeeper|\bGK\b/i.test(p.pos))||starters[0],pool=starters.filter(p=>p!==keeper),formation=state.formation,parts=String(formation||'').split('-').map(Number);if(parts.length<1||parts.some(n=>!Number.isInteger(n)||n<1)||parts.reduce((a,b)=>a+b,0)!==count-1)parts=recommendedFormation(count).split('-').map(Number);let isBack=p=>/back|defen|\b(cb|lb|rb|lwb|rwb)\b/i.test(p.pos),isFront=p=>/strik|forward|winger|\b(st|fw|lw|rw)\b/i.test(p.pos);let rows=parts.map((n,i)=>{let type=i===0?'back':i===parts.length-1?'front':'mid',match=type==='back'?isBack:type==='front'?isFront:()=>true,chosen=pool.filter(match).slice(0,n);chosen.forEach(p=>pool.splice(pool.indexOf(p),1));while(chosen.length<n&&pool.length)chosen.push(pool.shift());return chosen}).reverse();return [...rows,[keeper]]}
function defaultPosition(id,zone,rowIndex,rowCount,zoneTotal=4){let key=String(id),stored=state.lineupPositions?.[key],last=Math.max(1,zoneTotal-1),y=18+zone*(72/last);return stored||{x:(rowIndex+1)/(rowCount+1)*100,y:Math.min(90,y)}}

function kitCss(team){let kit=team==='home'?state.homeKit:state.awayKit,main=team==='home'?state.home:state.away,trim=kit?.trim||(team==='home'?state.away:state.home),number=kit?.number||'#17231f',style=kit?.style||'solid',font=kit?.font||'Manrope';let pattern=style==='stripes'?`repeating-linear-gradient(90deg,${main} 0 7px,${trim} 7px 12px)`:style==='pinstripes'?`repeating-linear-gradient(90deg,${main} 0 10px,${trim} 10px 12px)`:style==='halves'?`linear-gradient(90deg,${main} 0 50%,${trim} 50%)`:style==='quarters'?`conic-gradient(${main} 0 25%,${trim} 0 50%,${main} 0 75%,${trim} 0)`:style==='hoops'?`repeating-linear-gradient(0deg,${main} 0 7px,${trim} 7px 12px)`:style==='sash'?`linear-gradient(145deg,${main} 0 42%,${trim} 42% 58%,${main} 58%)`:style==='central'?`linear-gradient(90deg,${main} 0 35%,${trim} 35% 65%,${main} 65%)`:style==='checkerboard'?`conic-gradient(${trim} 25%,${main} 0 50%,${trim} 0 75%,${main} 0) 0 0/18px 18px`:main;return `--kit-pattern:${pattern};--kit-number:${number};--kit-trim:${trim};--kit-number-font:'${font}'`}
function tintKitTemplate(img){let team=img.dataset.kitTeam;if(!team||!img.complete||!img.naturalWidth)return;let kit=team==='home'?state.homeKit:state.awayKit,main=team==='home'?state.home:state.away,trim=kit?.trim||(team==='home'?state.away:state.home),style=kit?.style||'solid',key=[main,trim,style].join('|');if(img.dataset.tintKey===key)return;try{let c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);let frame=ctx.getImageData(0,0,c.width,c.height),px=frame.data,hex=h=>{h=String(h||'#ffffff').replace('#','');return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]},a=hex(main),b=hex(trim),stripeCount=style==='stripes'?8:style==='pinstripes'?22:style==='hoops'?10:1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let i=(y*c.width+x)*4;if(px[i+3]===0)continue;let nx=x/c.width,ny=y/c.height,alt=style==='halves'?nx>=.5:style==='stripes'||style==='pinstripes'?Math.floor(nx*stripeCount)%2===1:style==='hoops'?Math.floor(ny*stripeCount)%2===1:style==='quarters'?((nx>=.5)!==(ny>=.5)):style==='sash'?((nx+1-ny)%0.72)<0.19:style==='central'?nx>=.35&&nx<=.65:style==='checkerboard'?((Math.floor(nx*4)+Math.floor(ny*6))%2===1):false,color=alt?b:a,shade=(px[i]+px[i+1]+px[i+2])/765;px[i]=Math.round(color[0]*shade);px[i+1]=Math.round(color[1]*shade);px[i+2]=Math.round(color[2]*shade)}ctx.putImageData(frame,0,0);img.dataset.tintKey=key;img.src=c.toDataURL('image/png')}catch(e){img.dataset.tintKey=key;img.style.filter=''} }
function kitShirtHTML(team,number,captain=false,extraClass=''){return '<span class="kit-shirt '+extraClass+'" style="'+kitCss(team)+'"><img class="kit-shirt-lines" data-kit-team="'+team+'" src="'+KIT_SHIRT_DATA+'" onload="tintKitTemplate(this)" alt=""><b class="kit-shirt-number">'+esc(number)+'</b>'+(captain?'<em class="captain-badge">C</em>':'')+'</span>'}

function kitPreviewUpdate(){for(const team of ['home','away']){const style=$('#'+team+'KitStyle'),trim=$('#'+team+'KitTrim'),number=$('#'+team+'KitNumber'),font=$('#'+team+'KitFont');state[team+'Kit']={...(state[team+'Kit']||{}),style:style?.value||'solid',trim:trim?.value||state[team],number:number?.value||'#17231f',font:font?.value||'Manrope'}}save();render()}
function kitEditor(team){let name=team==='home'?'Home':'Away',kit=team==='home'?state.homeKit:state.awayKit;return `<div class="kit-editor"><div class="kit-preview" id="${team}KitPreview">${kitFlatPreviewHTML(team)}<div><b>${name} kit</b><small>${esc(state.club)}</small></div></div><div class="field"><label>${name.toUpperCase()} KIT STYLE</label><select id="${team}KitStyle" onchange="kitPreviewUpdate()"><option value="solid" ${kit.style==='solid'?'selected':''}>Solid</option><option value="stripes" ${kit.style==='stripes'?'selected':''}>Classic stripes</option><option value="pinstripes" ${kit.style==='pinstripes'?'selected':''}>Fine pinstripes</option><option value="halves" ${kit.style==='halves'?'selected':''}>Two halves</option><option value="quarters" ${kit.style==='quarters'?'selected':''}>Four quarters</option><option value="central" ${kit.style==='central'?'selected':''}>Central panel</option><option value="sash" ${kit.style==='sash'?'selected':''}>Diagonal sash</option><option value="hoops" ${kit.style==='hoops'?'selected':''}>Horizontal hoops</option><option value="checkerboard" ${kit.style==='checkerboard'?'selected':''}>Checkerboard</option></select></div><div class="field"><label>NUMBER FONT</label><select id="${team}KitFont" onchange="kitPreviewUpdate()">${['Manrope','DM Mono','Impact','Arial Black','Georgia'].map(f=>`<option value="${f}" ${(kit.font||'Manrope')===f?'selected':''}>${f}</option>`).join('')}</select></div><div class="two-fields"><div class="field"><label>TRIM / PATTERN COLOR</label><input type="color" id="${team}KitTrim" value="${kit.trim}" onchange="kitPreviewUpdate()" aria-label="${name} trim color"></div><div class="field"><label>NUMBER COLOR</label><input type="color" id="${team}KitNumber" value="${kit.number}" onchange="kitPreviewUpdate()" aria-label="${name} number color"></div></div></div>`}
function openSubstitution(outId){let out=state.players.find(p=>p.id===outId),bench=lineupBench();if(!out||!bench.length){toast(bench.length?'Choose a starting player first':'No substitutes available for this match format');return}let modal=$('#modal');modal.innerHTML=`<section class="substitution-modal"><button class="image-preview-close" onclick="closePreview()">×</button><div class="eyebrow">MATCHDAY SUBSTITUTION</div><h2>Who comes on?</h2><p class="substitution-context"><span>OFF</span><strong>#${out.number} · ${esc(out.name)}</strong><span class="substitution-arrow">→</span><span>Choose a substitute</span></p><div class="substitution-options">${bench.map(p=>`<button class="substitution-option" onclick="completeSubstitution(${outId},${p.id})">${kitShirtHTML(state.lineupKit==='away'?'away':'home',p.number,false,'substitution-kit')}<span><strong>${esc(p.name)}</strong><small>${esc(positionText(p))} · #${p.number}</small></span><b>ON</b></button>`).join('')}</div><button class="btn btn-light" onclick="closePreview()">Cancel</button></section>`;modal.classList.add('open')}

st yet')}</div><div class="fixture-entry-actions"><button class="btn btn-light btn-sm" onclick="startFixture('${f.id}')">Open match centre</button><button class="text-link" onclick="removeFixture('${f.id}')">Remove</button></div></article>`}).join('')||'<p class="muted">Your upcoming games will appear here.</p>'}</section></div>`}function saveFixture(){let opponent=$('#fixtureOpponent').value.trim(),date=$('#fixtureDate').value,time=$('#fixtureTime').value;if(!opponent||!date||!time){toast('Add an opponent, date and kick-off time');return}if(Date.parse(`${date}T${time}`)<=Date.now()){toast('Choose a future date and kick-off time');return}state.fixtures.push({id:'f'+Date.now(),opponent,date,time,format:$('#fixtureFormat').value,venue:$('#fixtureVenue').value.trim(),bring:$('#fixtureBring').value.trim()});save();render();toast('Fixture added')}function removeFixture(id){state.fixtures=(state.fixtures||[]).filter(f=>f.id!==id);save();render()}function startFixture(id){let f=state.fixtures.find(q=>q.id===id);if(!f)return;state.opponent=f.opponent;state.format=f.format;state.matchVenue=f.venue;state.matchBring=f.bring;state.matchFixtureId=f.id;state.liveSince=0;state.matchStarted=false;state.matchEnded=false;state.matchPeriod='first';state.lineupIds=lineupStarters().map(p=>p.id).slice(0,formatCount());state.lineupAssignments={};if(!formationsForCount(formatCount()).includes(state.formation))state.formation=recommendedFormation(formatCount());state.score=[0,0];state.clock=0;state.events=[];state.matchStarted=false;state.matchEnded=false;state.matchPeriod='first';state.matchSaved=false;state.matchAppearanceSaved=false;state.live=false;state.page='match';save();render()}function pageSettings(){let signed=!!state.account?.token;return `${title('PREFERENCES & ACCOUNT','Settings','Account, appearance, teams and portable data for this device.','')}<div class="settings-stack"><section class="panel form-card"><h2>Appearance</h2><p>Choose a light or dark clubhouse.</p><div class=" ntApi('teams/'+encodeURIComponent(membership.id)+'/data',{headers:{'Authorization':'Bearer '+state.account.token}}),d=await r.json();if(!r.ok||+d.revision<=+(profile.revision||0))continue;let data=JSON.parse(d.data);profile.data=data;profile.name=data.club||profile.name;profile.revision=+d.revision;if(profile.id===state.activeTeamId){for(let k of TEAM_FIELDS)if(data[k]!==undefined)state[k]=structuredClone(data[k]);activeChanged=true}}if(activeChanged){let page=state.page;suppressCloudSync=true;render();suppressCloudSync=false;state.page=page;localStorage.setItem('touchline-demo',JSON.stringify(packedState()));toast('Shared team updates loaded')}}catch(e){console.warn('Shared team refresh unavailable',e)}}async function joinTeamByCode(){if(!state.account?.token)return toast('Sign in first');let inviteCode=$('#teamInviteCode')?.value.trim().toUpperCase();if(!inviteCode)return toast('Enter a team invite code');try{let r=await accountApi('teams/join',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.account.token},body:JSON.stringify({inviteCode,playerId:$('#teamJoinPlayerId')?.value.trim()||state.account.playerId||''})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not join that team');await loadSharedTeam(d.id);toast('Joined '+d.name)}catch(e){toast(e.message)}}async function loadSharedTeam(teamId){if(!state.account?.token)return toast('Sign in first');try{let r=await accountApi('teams/'+encodeURIComponent(teamId)+'/data',{headers:{'Authorization':'Bearer '+state.account.token}}),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load the shared team');let data=JSON.parse(d.data),profile={id:teamId,name:data.club||'Shared team',data,revision:+d.revision||1};let existing=state.teamProfiles.find(t=>t.id===teamId);if(existing)Object.assign(existing,profile);else state.teamProfiles.push(profile);for(let k of TEAM_FIELDS)if(data[k]!==undefined)state[k]=structuredClone(data[k]);state.activeTeamId=teamId;if(stat function saveRatings(){let rated=0;state.players.forEach(p=>{if(state.ratings[p.id]){p.rating=+((p.rating*2+state.ratings[p.id])/3).toFixed(1);rated++}});let latest=state.history[0];if(latest){latest.rating=+(lineupStarters().reduce((sum,p)=>sum+(state.ratings[p.id]||p.rating),0)/Math.max(1,lineupStarters().length)).toFixed(1);latest.playerRatings={...state.ratings}}state.ratings={};state.page='match';save();render();toast(`Ratings saved for ${rated} players`)}

function openHistory(id){state.selectedHistory=id;state.page='historyMatch';save();render()}
function filterHistory(format){$$('#historyRows .history-match').forEach(row=>row.style.display=format==='all'||row.dataset.format===format?'':'none')}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null})}else toast('Launch Start Touchline from this folder, then choose Install in your browser menu')}
let deferredInstall=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;let b=$('#installButton');if(b)b.style.display='inline-flex'});if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(()=>{});
function myAvailability(v,id=state.selectedPlayerId){let p=player(id);if(!p)return;state.myAvail=v;p.avail=v;save();render();toast(v==='yes'?'You’re marked available':v==='no'?'You’re marked unavailable':'Availability updated')}
function cycleAvailability(id){let p=player(id);p.avail=p.avail==='yes'?'no':p.avail==='no'?'pending':'yes';save();render();toast(`${p.first} marked ${p.avail==='yes'?'available':p.avail==='no'?'unavailable':'pending'}`)}
function filterSquad(){let q=$('#searchPlayer').value.toLowerCase();$$('#squadRows tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
function filterAvailability(v){$$('#squadRows tr').forEach(tr=>tr.style.display=v==='all'||tr.querySelector('.status').classList.contains(v)?'':'none')}
function pickColor(which,c){if(!/^#[0-9a-f]{6}$/i.test(c)){toast('Choose a valid color');return}state[which]=c.toUpperCase();if(which==='home')state.homeKit.trim=state.homeKit.trim||state.away;if(which==='away')state.awayKit.trim=state.awayKit.trim||state.home;save();const picker=document.querySelector(`[aria-label="Choose any ${which} color"]`),hex=document.querySelector(`[aria-label="${which==='home'?'Home':'Away'} color hex value"]`);if(picker)picker.value=state[which];if(hex)hex.value=state[which];document.querySelectorAll('.color-chip').forEach(chip=>chip.classList.toggle('selected',chip.getAttribute('aria-label')===state[which]));applyTheme();document.querySelectorAll('.crest:not(.opponent)').forEach(el=>el.style.backgroundColor=state.home);document.querySelectorAll('.shirt.jersey,.shirt.dot').forEach(el=>el.style.backgroundColor=state.home);render()}
function saveSetup(){state.homeKit={style:$('#homeKitStyle').value,trim:$('#homeKitTrim').value,number:$('#homeKitNumber').value};state.awayKit={style:$('#awayKitStyle').value,trim:$('#awayKitTrim').value,number:$('#awayKitNumber').value};state.club=$('#clubInput').value.trim()||state.club;state.crest=$('#crestInput').value.trim().slice(0,3).toUpperCase()||state.crest;state.format=$('#formatInput').value;state.lineupIds=lineupStarters().map(p=>p.id).slice(0,formatCount());if(!formationsForCount(formatCount()).includes(state.formation)){state.formation=recommendedFormation(formatCount());state.lineupPositions={}}state.opponent=$('#opponentInput').value.trim()||state.opponent;state.captainId=+$('#captainInput').value||state.captainId;state.lineupStyle=$('#lineupStyleInput').value;state.lineupFont=$('#lineupFontInput').value;state.pitchColor=$('#pitchHex').value.trim()||state.pitchColor;save();render();toast('Club and lineup design saved')}
async function previewLogo(input){let file=input.files?.[0];if(!file)return;try{state.logoCropSourceDraft=await scaledImageData(file,1200,'image/png');state.logoCropDraft={...(state.logoCrop||{zoom:1,x:50,y:50}),shape:state.crestShape||'shield'};openLogoCrop()}catch(e){toast('Could not load that crest')}}
function autoLineup(){state.formation=recommendedFormation(formatCount());state.lineupPositions={};state.lineupAssignments={};save();render();toast('Suggested formation restored')}
function makeStarter(id,position){id=+id;if(lineupStarters().some(p=>p.id===id))return;if(lineupStarters().length>=formatCount()){toast(`Your ${state.format} lineup is full. Remove a player first.`);return}state.lineupIds=[...lineupStarters().map(p=>p.id),id];if(position){state.lineupPositions=state.lineupPositions||{};state.lineupPositions[String(id)]=position}if(!state.captainId)state.captainId=id;if(!state.lineupFeaturePlayerId)state.lineupFeaturePlayerId=id;save();render();toast('Player added to your starting XI')}
function toggleLineupPlayer(id){id=+id;let ids=lineupStarters().map(p=>p.id),index=ids.indexOf(id);if(index>=0){ids.splice(index,1);delete state.lineupPositions?.[String(id)];for(let slot of Object.keys(state.lineupAssignments||{}))if(+state.lineupAssignments[slot]===id)delete state.lineupAssignments[slot];if(state.captainId===id)state.captainId=ids[0]||0}else{if(ids.length>=formatCount()){toast(`Your ${state.format} lineup is full. Remove a player first.`);return}ids.push(id);if(!state.captainId)state.captainId=id;if(!state.lineupFeaturePlayerId)state.lineupFeaturePlayerId=id}state.lineupIds=ids;if(state.lineupFeaturePlayerId===id&&!ids.includes(id))state.lineupFeaturePlayerId=ids[0]||0;save();render()}
function clearLineup(){state.lineupIds=[];state.lineupPositions={};state.lineupAssignments={};state.lineupFeaturePlayerId=0;state.captainId=0;save();render();toast('Starting XI cleared. Pick your players above.')}
function openSlotPicker(slotId){let slot=formationSlots().find(s=>s.id===slotId);if(!slot)return;let current=player(state.lineupAssignments?.[slotId]),taken=new Set(Object.entries(state.lineupAssignments||{}).filter(([key])=>key!==slotId).map(([,id])=>+id)),options=state.players.filter(p=>!taken.has(p.id));const aliases={'GK':['GK','GOALKEEPER'],'LB':['LB','LEFT BACK'],'LWB':['LWB','LEFT WING BACK'],'CB':['CB','CENTRE BACK','CENTER BACK'],'LCB':['CB','CENTRE BACK','CENTER BACK'],'RCB':['CB','CENTRE BACK','CENTER BACK'],'RB':['RB','RIGHT BACK'],'RWB':['RWB','RIGHT WING BACK'],'DM':['DM','CDM','DEFENSIVE MID'],'CDM':['DM','CDM','DEFENSIVE MID'],'CM':['CM','CENTRAL MID'],'LCM':['CM','CENTRAL MID'],'RCM':['CM','CENTRAL MID'],'AM':['AM','CAM','ATTACKING MID'],'CAM':['AM','CAM','ATTACKING MID'],'LM':['LM','LEFT MID','WINGER'],'LW':['LW','LEFT WING','WINGER'],'RW':['RW','RIGHT WING','WINGER'],'RM':['RM','RIGHT MID','WINGER'],'ST':['ST','STRIKER','FORWARD'],'CF':['CF','CENTRE FORWARD','FORWARD']};let code=String(slot.label||'').toUpperCase(),wanted=aliases[code]||[code];function fit(p){let positions=(p.positions||[p.pos||'']).map(v=>String(v).toUpperCase()),text=positions.join(' ');return positions.some(v=>wanted.some(w=>v===w||v.includes(w)||w.includes(v)))||wanted.some(w=>text.includes(w))?1:0}options.sort((a,b)=>fit(b)-fit(a)||Number(b.rating||0)-Number(a.rating||0)||a.name.localeCompare(b.name));let modal=$('#modal');modal.innerHTML=`<section class="substitution-modal"><button class="image-preview-close" onclick="closePreview()">×</button><div class="eyebrow">FORMATION POSITION · ${esc(slot.label)}</div><h2>${current?'Change':'Choose'} player for ${esc(slot.label)}</h2><p class="muted">Players who list this position first are suggested at the top.</p><div class="substitution-options">${options.map((p,i)=>`<button class="substitution-option" onclick="assignLineupSlot('${slotId}',${p.id})">${kitShirtHTML(state.lineupKit==='away'?'away':'home',p.number,false,'substitution-kit')}<span><strong>${esc(p.name)}</strong><small>#${p.number} · ${esc(positionText(p))}${lineupStarters().some(q=>q.id===p.id)?' · Selected':''}</small></span><b>${fit(p)?'SUGGESTED':current?'SET':'ADD'}</b></button>`).join('')||'<p>No available squad players.</p>'}</div>${current?`<button class="btn btn-light" onclick="clearLineupSlot('${slotId}')">Clear this position</button>`:''}</section>`;modal.classList.add('open')}
function assignLineupSlot(slotId,id){id=+id;let current=+state.lineupAssignments?.[slotId]||0,other=Object.entries(state.lineupAssignments||{}).find(([key,value])=>key!==slotId&&+value===id);state.lineupIds=lineupStarters().map(p=>p.id);if(other){if(current)state.lineupAssignments[other[0]]=current;else delete state.lineupAssignments[other[0]];state.lineupAssignments[slotId]=id}else{if(!state.lineupIds.includes(id)){if(state.lineupIds.length>=formatCount()&&current)state.lineupIds=state.lineupIds.filter(pid=>pid!==current);else if(state.lineupIds.length>=formatCount()){toast('This lineup is full. Remove a player first.');return}state.lineupIds.push(id)}if(current&&current!==id)state.lineupIds=state.lineupIds.filter(pid=>pid!==current);state.lineupAssignments[slotId]=id}if(!state.captainId)state.captainId=id;if(!state.lineupFeaturePlayerId)state.lineupFeaturePlayerId=id;save();closePreview();render()}
function swapLineupSlots(from,to){let assignments=state.lineupAssignments||{},a=assignments[from],b=assignments[to];if(b)assignments[from]=b;else delete assignments[from];if(a)assignments[to]=a;else delete assignments[to];state.lineupAssignments=assignments;save();render()}
function clearLineupSlot(slotId){let id=+state.lineupAssignments?.[slotId];delete state.lineupAssignments?.[slotId];if(id&&!Object.values(state.lineupAssignments||{}).some(value=>+value===id))state.lineupIds=lineupStarters().map(p=>p.id).filter(pid=>pid!==id);save();closePreview();render()}
function removeStarter(id){id=+id;state.lineupIds=lineupStarters().map(p=>p.id).filter(pid=>pid!==id);delete state.lineupPositions?.[String(id)];for(let slot of Object.keys(state.lineupAssignments||{}))if(+state.lineupAssignments[slot]===id)delete state.lineupAssignments[slot];if(state.captainId===id)state.captainId=state.lineupIds[0]||0;if(state.lineupFeaturePlayerId===id)state.lineupFeaturePlayerId=state.lineupIds[0]||0;save();render();toast('Player moved to available squad')}
function editPlayerNumber(id){let p=player(id);if(!p)return;let modal=$('#modal');modal.innerHTML='<section class="substitution-modal jersey-number-modal" role="dialog" aria-modal="true" aria-labelledby="jerseyNumberTitle"><button class="image-preview-close" onclick="closePreview()" aria-label="Close">×</button><div class="eyebrow">SQUAD NUMBER</div><h2 id="jerseyNumberTitle">Edit jersey number</h2><p class="muted" style="margin-top:-7px">'+esc(p.name)+' · choose a unique number from 1 to 99.</p><label class="jersey-number-label" for="jerseyNumberInput">PLAYER NUMBER</label><input id="jerseyNumberInput" class="jersey-number-input" type="number" inputmode="numeric" min="1" max="99" step="1" value="'+p.number+'" onkeydown="if(event.key===&quot;Enter&quot;)savePlayerNumber('+p.id+')"><div class="modal-actions"><button class="btn btn-light" onclick="closePreview()">Cancel</button><button class="btn btn-dark" onclick="savePlayerNumber('+p.id+')">Save jersey number</button></div></section>';modal.classList.add('open');requestAnimationFrame(()=>$('#jerseyNumberInput')?.select())}function savePlayerNumber(id){let p=player(id);if(!p)return;let clean=$('#jerseyNumberInput')?.value.trim()||'';if(!/^\d{1,2}$/.test(clean)||+clean<1||+clean>99){$('#jerseyNumberInput')?.focus();return toast('Choose a whole jersey number from 1 to 99')}let number=+clean,other=state.players.find(q=>+q.id!==+p.id&&+q.number===number);if(other){$('#jerseyNumberInput')?.focus();return toast('Jersey number '+number+' is already used by '+other.name)}p.number=number;save();closePreview();render();toast(p.name+' is now #'+number)}function removePlayerFromSquad(id){let p=player(id);if(!p)return;if(!confirm(`Remove ${p.name} from the squad? Past match records will be preserved.`))return;state.players=state.players.filter(q=>q.id!==id);state.lineupIds=(state.lineupIds||[]).filter(pid=>+pid!==+id);for(let [slot,pid] of Object.entries(state.lineupAssignments||{}))if(+pid===+id)delete state.lineupAssignments[slot];if(+state.captainId===+id)state.captainId=state.players[0]?.id||0;if(+state.lineupFeaturePlayerId===+id)state.lineupFeaturePlayerId=state.players[0]?.id||0;if(+state.lineupFeaturePhotoPlayerId===+id){state.lineupFeaturePhotoData='';state.lineupFeaturePhotoPlayerId=0}delete state.ratings[id];if(+state.selectedPlayerId===+id)state.selectedPlayerId=state.players[0]?.id||0;save();render();toast(`${p.name} removed; past match records were preserved`)}function editManagerName(){let name=prompt('Manager name',state.manager||'');if(name===null)return;state.manager=name.trim().slice(0,48);save();render();toast(state.manager?'Manager name updated':'Manager name cleared')}function previewStartingLineup(){let starters=lineupStarters();if(!starters.length){toast('Choose players for the starting XI first');return}let pitch=$('#content .drag-pitch');if(!pitch){toast('Open the Lineup section to preview the starting XI');return}let clone=pitch.cloneNode(true),slots=formationSlots(),bySlot=new Map(slots.map(slot=>[state.lineupAssignments?.[slot.id],slot])),rows=starters.map(p=>{let slot=bySlot.get(p.id);return `<div class="starting-preview-player"><b>${p.number}</b><span><strong>${esc(p.name)}</strong><small>${esc(slot?.label||positionLabel(positionText(p)))}</small></span>${p.id===state.captainId?'<em>C</em>':''}</div>`}).join(''),bench=lineupBench().map(p=>`<div class="starting-preview-player"><b>${p.number}</b><span><strong>${esc(p.name)}</strong><small>${esc(positionText(p))}</small></span></div>`).join(''),modal=$('#modal');clone.querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));modal.innerHTML=`<section class="image-preview-modal starting-xi-modal"><button class="image-preview-close" onclick="closePreview()">×</button><div class="eyebrow">LINEUP PREVIEW · ${esc(state.formation)} · ${esc(state.lineupKit==='away'?'AWAY KIT':'HOME KIT')}</div><h2>${esc(state.club)} vs ${esc(state.opponent)}</h2><div class="starting-preview-grid">${clone.outerHTML}<div class="starting-preview-lists"><h3>Starting XI <span>${starters.length}</span></h3>${rows}${bench?`<h3 class="bench-preview-heading">Bench <span>${lineupBench().length}</span></h3>${bench}`:''}</div></div><div class="modal-actions"><button class="btn btn-light" onclick="closePreview()">Close</button><button class="btn btn-light" onclick="closePreview();downloadStartingLineup(\'post\')">Download post</button><button class="btn btn-light" onclick="closePreview();downloadStartingLineup(\'story\')">Download story</button><button class="btn btn-dark" onclick="closePreview();downloadLineup(\'post\')">Preview poster</button></div></section>`;modal.classList.add('open');modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.scrollTop=0}function addPlayer(){let name=prompt('New player name');if(!name?.trim())return;let p={id:Date.now(),name:name.trim(),first:name.trim().split(' ')[0],last:name.trim().split(' ').slice(1).join(' '),number:state.players.length+1,pos:'Forward',positions:['Forward'],avail:'pending',apps:0,goals:0,assists:0,rating:0,face:name.trim().slice(0,2).toUpperCase(),tone:'alt2'};state.players.push(p);save();render();toast(`${p.first} added to your squad`)}
function openRating(){toast('Your manager will share match ratings after full time')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page);let m=e.target.closest('[data-mode]');if(m)setMode(m.dataset.mode)});
render();setInterval(pollAccountChanges,12000);setInterval(pollSharedTeamUpdates,12000);function currentClockSeconds(){return(+state.clock||0)+(state.live&&!state.matchEnded?Math.max(0,Math.floor((Date.now()-(+state.liveSince||Date.now()))/1000)):0)}function paintClock(){let total=currentClockSeconds(),display=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');['#matchClock','#heroClock'].forEach(sel=>{let el=$(sel);if(el){el.textContent=display;el.classList.toggle('is-live',!!state.live&&!state.matchEnded)}})}paintClock();setInterval(paintClock,250);document.addEventListener('visibilitychange',paintClock);
</script>
